<nav class="admin-nav">
    @if (isLoggedIn && isAdmin) {
    <div class="admin-nav__brand">
        <span class="admin-nav__title">Leu Gebäudeservice</span>
        <span class="admin-nav__subtitle">Administration</span>
    </div>
    <div class="admin-nav__links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            {{ 'NAV.REQUEST' | translate }}
        </a>
        <a routerLink="/availability" routerLinkActive="active">
            {{ 'NAV.AVAILABILITY' | translate }}
        </a>
        <a routerLink="/customers" routerLinkActive="active">
            {{ 'NAV.CUSTOMERS' | translate }}
        </a>
    </div>
    }

    <div class="admin-nav__actions">

        @if (isLoggedIn) {

        <span class="username">
            {{ username }}
        </span>

        <span class="role">
            Admin
        </span>

        <button type="button" (click)="logout()">
            {{ 'NAV.LOGOUT' | translate }}
        </button>

        } @else {

        <button type="button" (click)="login()">
            {{ 'NAV.LOGIN' | translate }}
        </button>

        }

    </div>

</nav>
